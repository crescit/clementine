[project]
name = "clearpath"
version = "0.1.0"
description = "ClearPath Compliance Review — fictional marketing compliance queue demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clearpath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
